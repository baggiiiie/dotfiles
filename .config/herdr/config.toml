[theme]
name = "gruvbox"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui]
show_agent_labels_on_pane_borders = true

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[keys]
# Herdr default detach is prefix+q; prefix+d is unbound by default.
detach = "prefix+d"
# Herdr's built-in previous_workspace cycles through workspace order; use a
# custom MRU toggle so prefix+L bounces current <-> last visited workspace.
previous_workspace = ""
copy_mode = "prefix+enter"

# Keep directional pane focus on arrow keys so prefix+l can mirror tmux's
# last-window behavior for Herdr tabs.
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# Route tab navigation through the MRU helper so prefix+l can toggle to the
# last focused tab in the current workspace.
previous_tab = ""
next_tab = ""
switch_tab = ""

[[keys.command]]
key = "prefix+shift+L"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-workspace.sh"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-relative -1"

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-relative 1"

[[keys.command]]
key = "prefix+1"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 1"

[[keys.command]]
key = "prefix+2"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 2"

[[keys.command]]
key = "prefix+3"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 3"

[[keys.command]]
key = "prefix+4"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 4"

[[keys.command]]
key = "prefix+5"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 5"

[[keys.command]]
key = "prefix+6"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 6"

[[keys.command]]
key = "prefix+7"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 7"

[[keys.command]]
key = "prefix+8"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 8"

[[keys.command]]
key = "prefix+9"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-toggle-last-tab.sh --focus-number 9"

# tmux prefix+! equivalent: break the current pane out into a new tab/window.
[[keys.command]]
key = "prefix+!"
type = "shell"
command = "pane_id=$(herdr pane current | python3 -c 'import json,sys; print(json.load(sys.stdin).get(\"result\",{}).get(\"pane\",{}).get(\"pane_id\",\"\"))' 2>/dev/null); pane_id=${pane_id:-${HERDR_PANE_ID:-}}; [ -n \"$pane_id\" ] && herdr pane move \"$pane_id\" --new-tab --focus >/dev/null 2>&1 || true"

# Project sessionizer — mirrors the prefix+<letter> bindings in ~/.tmux.conf.
# Each shortcut focuses an existing workspace (matched by label, full key then
# basename) or creates one at the project cwd. See others/herdr-sessionizer.sh.
#
# prefix+f            fuzzy-pick a project (interactive, opens a temp pane)
# prefix+<Shift+X>     jump directly to a project
#
# NOTE: prefix+shift+d here overrides herdr's built-in close_workspace binding.
[[keys.command]]
key = "prefix+f"
type = "pane"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-sessionizer.sh"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-sessionizer.sh personal/simple-cv"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-sessionizer.sh personal/jjui"

