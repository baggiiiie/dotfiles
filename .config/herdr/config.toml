type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-sessionizer.sh work/edgeos-ui"

[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-sessionizer.sh home"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-sessionizer.sh work/edgeos-karate-test-automation"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "bash $HOME/repos/personal/dotfiles/others/herdr-sessionizer.sh work/edgeos-innovation-projects"
